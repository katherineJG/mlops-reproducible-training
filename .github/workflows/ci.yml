name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: make check
      - run: uv run dvc repro
      # Linux must reproduce the committed (Windows-generated) metrics exactly, and every lock hash
      # except the pickled models' (one md5 line changed = 2 diff lines: observed not byte-stable).
      - run: |
          git diff --exit-code reports/metrics.json
          changed=$(git diff -U0 dvc.lock | grep -cE '^[+-] +md5' || true)
          if [ "$changed" -gt 2 ]; then
            echo "::error::dvc.lock is stale or not reproducible. After changing code or configs, run 'uv run dvc repro' and commit dvc.lock."
            git diff -U0 dvc.lock
            exit 1
          fi
      - run: docker build -t churn-pipeline:ci .
      # exit code 0 only if ingest, validation, training and the evaluation gates all pass
      - run: docker run --rm churn-pipeline:ci
