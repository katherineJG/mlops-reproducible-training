name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: make check
      - run: uv run dvc repro
      # Linux must reproduce the committed (Windows-generated) hashes and metrics
      - run: git diff --exit-code dvc.lock reports/metrics.json
